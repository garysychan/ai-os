[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-os"
version = "0.1.0a0"
description = "Governed, traceable and executable agentic AI operating system."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gary Chan" },
]
keywords = [
    "ai-os",
    "agent-runtime",
    "control-plane",
    "workflow",
    "codex",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.scripts]
aios = "ai_os.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["ai_os"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []



[tool.ruff.lint.per-file-ignores]
"scripts/control_plane_check.py" = ["I001"]
"src/ai_os/agents/models.py" = ["UP042"]
"src/ai_os/agents/roles.py" = ["I001"]
"src/ai_os/agents/runtime.py" = ["SIM102"]
"src/ai_os/governance/__init__.py" = ["I001"]
"src/ai_os/governance/loader.py" = ["UP035"]
"src/ai_os/tasks/models.py" = ["UP042"]
"src/ai_os/workflow/state_machine.py" = ["UP017"]
"tests/agents/test_models.py" = ["I001"]
"tests/agents/test_permissions.py" = ["I001"]
"tests/agents/test_registry.py" = ["I001"]
"tests/agents/test_router.py" = ["I001"]
"tests/agents/test_runtime.py" = ["I001"]
"tests/tasks/test_models.py" = ["I001"]
"tests/test_consistency_checker.py" = ["I001"]
"tests/test_consistency_fix_cycle.py" = ["I001"]
"tests/test_control_plane_loader.py" = ["I001", "SIM117"]
"tests/test_task_cli.py" = ["I001"]
"tests/workflow/test_state_machine.py" = ["I001", "UP017"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ai_os"]
mypy_path = "src"
warn_unused_configs = true


[[tool.mypy.overrides]]
module = "ai_os.agents.router"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "ai_os.cli"
disable_error_code = ["dict-item"]
