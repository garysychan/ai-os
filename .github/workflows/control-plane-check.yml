name: Control Plane Check

on:
  push:
    branches:
      - main
      - feature/executable-ai-os-v2
    paths:
      - "CONTROL_PLANE.md"
      - "AGENTS.md"
      - "PROJECT_RULES.md"
      - "ARCHITECTURE.md"
      - "WORKFLOW.md"
      - "TASKS.md"
      - "README.md"
      - "docs/**"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/control-plane-check.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install AI OS and quality tools
        run: python -m pip install --editable ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Check lint
        run: ruff check src tests scripts

      - name: Check formatting of changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t python_files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA...HEAD" -- "*.py")
          else
            mapfile -t python_files < <(git diff-tree --no-commit-id --name-only -r HEAD -- "*.py")
          fi
          if (( ${#python_files[@]} )); then
            ruff format --check "${python_files[@]}"
          else
            echo "No changed Python files require format validation."
          fi

      - name: Check static types
        run: mypy src/ai_os

      - name: Run tests with coverage gate
        run: pytest --cov=ai_os --cov-report=term-missing --cov-report=xml

      - name: Build distribution
        run: python -m build

      - name: Bootstrap Control Plane
        run: aios bootstrap --root .

      - name: Run Control Plane Consistency Check
        run: aios control-plane check --root .

      - name: Save machine-readable status
        if: always()
        run: |
          mkdir -p artifacts
          aios control-plane check --root . --json > artifacts/control-plane-status.json

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-python-${{ matrix.python-version }}
          path: |
            artifacts/control-plane-status.json
            coverage.xml
          if-no-files-found: warn
          retention-days: 14
